<!DOCTYPE html>
<html>
<head>
    <title>Usuarios</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Lista de Usuarios</h1>
    <table border="1" cellpadding="5">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for usuario in usuarios %}
            <tr>
                <td>{{ usuario.nombre }}</td>
                <td>{{ usuario.correo }}</td>
                <td>
                    <a href="/usuarios/{{ usuario.id }}/reporte">Generar reporte de descuentos</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
